name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Bundle Desktop (Windows x64)
        env:
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
        run: pnpm bundle:desktop -- --os win --arch x64
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-${{ github.ref_name }}-win-x64
          path: packages/desktop/dist/*.exe
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Bundle Desktop (macOS ARM64)
        env:
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
        run: pnpm bundle:desktop -- --os mac --arch arm64
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-${{ github.ref_name }}-mac-arm64
          path: packages/desktop/dist/*.dmg
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
      - name: Build
        run: pnpm build
      - name: Bundle Desktop (Linux x64)
        env:
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
        run: pnpm bundle:desktop -- --os linux --arch x64
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-${{ github.ref_name }}-linux-x64
          path: packages/desktop/dist/*.AppImage
          retention-days: 30

  release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZCode-${{ github.ref_name }}-win-x64
          path: dist/win
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZCode-${{ github.ref_name }}-mac-arm64
          path: dist/mac
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZCode-${{ github.ref_name }}-linux-x64
          path: dist/linux
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win/*.exe
            dist/mac/*.dmg
            dist/linux/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
