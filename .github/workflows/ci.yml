name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 根 typecheck 是显式列举的 `tsc -b packages/*`，覆盖不到 apps/zcode-cli；
      # CLI 侧的类型检查只写在 apps/zcode-cli/AGENTS.md「验证」里，此前没有任何作业执行它。
      # 这里用 --filter 而不是文档里那条 `pnpm --dir apps/zcode-cli typecheck`：
      # apps/zcode-cli 是自带 pnpm-workspace.yaml 与 pnpm-lock.yaml 的嵌套工作区，
      # turbo 只在它自己的 devDependencies 里，根 `pnpm install --frozen-lockfile` 不会装它，
      # 以该目录为 cwd 解析可执行文件就得到 `turbo: not found`。
      # 残留风险：--filter 形态依赖 runner 提供的全局 turbo；干净修法是在 CI 里安装嵌套工作区
      # 依赖，或把 turbo 提到根 devDependencies —— 两者都动依赖，属独立一次改动。
      - run: pnpm --filter zcode-cli run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  architecture:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zcode/desktop run test --if-present
      # 上一行在本仓库落地时是空操作：当时没有任何工作区包声明 test 脚本，
      # `--if-present` 什么都不跑却报 success。这一行走 adapters 包里声明的入口，
      # 把该包 tests/ 下的用例真的跑起来；保留 desktop 那行不动，等它自己有测试时自然生效。
      - run: pnpm --filter @zcode/adapters run test
